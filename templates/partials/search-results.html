{% if results %}
<div id="searchResults" class="absolute left-0 top-full mt-1 w-full bg-white border border-gray-200 rounded-lg shadow-lg max-h-64 overflow-y-auto z-50">
    {% for result in results %}
    <div class="px-4 py-2 hover:bg-gray-100 cursor-pointer text-gray-800">
    {{ result.common_name }} <a href="{{ result.bsbi_url }}"> LINK </a>
    </div>
    {% endfor %}
</div>
{% else %}
    <div id="searchResults" class="hidden"></div>
{% endif %}
