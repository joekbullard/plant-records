{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}A plant a day{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'css/output.css' %}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/obsidian.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>

</head>
<body class="text-white min-h-screen bg-emerald-900 flex flex-col">
    <nav class="bg-emerald-950 mx-auto w-screen px-4 sm:px-6 lg:px-8 shadow-md">
        <div class="container mx-auto px-4 flex h-32 items-center justify-between">
            <div class="hidden md:flex md:items-center md:gap-12">
                
            </div>
            <div>
                <img src="{% static 'img/plant-records-logo.svg' %}" class="w-32" alt="">
            </div>
            <div>
                <ul class="flex space-x-4">
                    <li><a href="#" class="hover:text-gray-300">Home</a></li>
                    <li><a href="{% url 'about' %}" class="hover:text-gray-300">About</a></li>
                    <li><a href="#" class="hover:text-gray-300">Contact</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="flex-grow flex items-center justify-center">
        <div class="container mx-auto px-4 py-8">
            {% block content %}
            <!-- Your page-specific content goes here -->
            {% endblock %}
        </div>
    </main>

    <!-- Footer -->
    <footer class="bg-gray-900 py-4 text-center">
        <p class="text-sm text-gray-400">&copy; 2025 MySite. All rights reserved.</p>
    </footer>
    <script>hljs.highlightAll();</script>
</body>
</html>
